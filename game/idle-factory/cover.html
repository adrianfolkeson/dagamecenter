<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idle Factory Tycoon - Cover</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 1280px;
      height: 720px;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #2d3a4a 100%);
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
      position: relative;
    }
    
    /* Factory silhouette */
    .factory {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 400px;
      background: #0d1117;
    }
    
    /* Factory buildings */
    .building {
      position: absolute;
      bottom: 0;
      background: #1a1a2e;
      border-top: 4px solid #333;
    }
    
    .b1 { left: 50px; width: 150px; height: 250px; }
    .b2 { left: 220px; width: 200px; height: 320px; background: #151520; }
    .b3 { left: 450px; width: 180px; height: 280px; }
    .b4 { right: 100px; width: 250px; height: 350px; background: #151520; }
    .b5 { right: 20px; width: 120px; height: 200px; }
    
    /* Windows */
    .window {
      position: absolute;
      width: 15px;
      height: 20px;
      background: #ffd700;
      box-shadow: 0 0 10px #ffd700;
      animation: flicker 2s infinite;
    }
    
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    
    .w1 { top: 30px; left: 20px; }
    .w2 { top: 80px; left: 60px; }
    .w3 { top: 30px; left: 40px; }
    .w4 { top: 60px; left: 80px; }
    .w5 { top: 30px; left: 20px; }
    
    /* Smoke stacks */
    .stack {
      position: absolute;
      bottom: 100%;
      width: 30px;
      height: 80px;
      background: #2d3a4a;
    }
    
    .s1 { left: 80px; }
    .s2 { left: 300px; height: 120px; }
    .s3 { right: 180px; height: 100px; }
    
    /* Smoke */
    .smoke {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 20px;
      background: rgba(100,100,100,0.5);
      border-radius: 50%;
      animation: rise 3s infinite;
    }
    
    @keyframes rise {
      0% { opacity: 0.8; transform: translateX(-50%) translateY(0) scale(1); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-100px) scale(2); }
    }
    
    /* Title */
    .title {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }
    
    .title h1 {
      font-size: 64px;
      font-weight: bold;
      background: linear-gradient(180deg, #ffd700 0%, #ff8c00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 20px rgba(255,215,0,0.5);
      letter-spacing: 2px;
    }
    
    .title h2 {
      font-size: 28px;
      color: #888;
      margin-top: 10px;
      font-weight: normal;
    }
    
    /* Icons */
    .icon {
      position: absolute;
      font-size: 80px;
      animation: bounce 1s infinite;
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    .robot { bottom: 400px; left: 150px; }
    .gear { bottom: 420px; right: 200px; font-size: 50px; }
    .coin { bottom: 380px; right: 150px; }
    
    /* Dollar signs floating */
    .dollar {
      position: absolute;
      font-size: 30px;
      color: #4ade80;
      animation: floatUp 2s infinite;
    }
    
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-100px); }
    }
    
    .d1 { bottom: 300px; left: 200px; animation-delay: 0s; }
    .d2 { bottom: 320px; left: 250px; animation-delay: 0.5s; }
    .d3 { bottom: 280px; left: 300px; animation-delay: 1s; }
    .d4 { bottom: 310px; right: 220px; animation-delay: 0.3s; }
    .d5 { bottom: 290px; right: 280px; animation-delay: 0.8s; }
    
    /* Glow effect */
    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(ellipse at center, rgba(255,215,0,0.1) 0%, transparent 70%);
      pointer-events: none;
    }
    
    /* Bottom gradient */
    .bottom-glow {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 150px;
      background: linear-gradient(180deg, transparent 0%, #0d1117 100%);
    }
    
    /* Play button hint */
    .play-hint {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      padding: 15px 50px;
      border-radius: 30px;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }
    
    /* World badges */
    .worlds {
      position: absolute;
      bottom: 150px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
    }
    
    .world {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      border: 3px solid #ffd700;
      background: rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  
  <div class="title">
    <h1>🏭 IDLE FACTORY TYCOON</h1>
    <h2>Build Your Empire!</h2>
  </div>
  
  <div class="factory">
    <div class="building b1">
      <div class="stack s1"><div class="smoke"></div></div>
      <div class="window w1"></div>
      <div class="window w2"></div>
    </div>
    <div class="building b2">
      <div class="stack s2"><div class="smoke"></div><div class="smoke" style="animation-delay: 1s;"></div></div>
      <div class="window w3"></div>
      <div class="window w4"></div>
    </div>
    <div class="building b3">
      <div class="stack s3"><div class="smoke"></div></div>
    </div>
    <div class="building b4">
      <div class="window w5"></div>
    </div>
    <div class="building b5"></div>
  </div>
  
  <div class="icon robot">🤖</div>
  <div class="icon gear">⚙️</div>
  <div class="icon coin">💰</div>
  
  <div class="dollar d1">$</div>
  <div class="dollar d2">$</div>
  <div class="dollar d3">$</div>
  <div class="dollar d4">$</div>
  <div class="dollar d5">$</div>
  
  <div class="worlds">
    <div class="world">🏭</div>
    <div class="world">⚡</div>
    <div class="world">🧪</div>
    <div class="world">🚀</div>
    <div class="world">🪓</div>
    <div class="world">🦕</div>
    <div class="world">🌊</div>
    <div class="world">🌋</div>
    <div class="world">🌴</div>
    <div class="world">🌃</div>
  </div>
  
  <div class="play-hint">▶ PLAY NOW</div>
  
  <div class="bottom-glow"></div>
</body>
</html>
